version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gradle
    directory: /java
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /bedrock
    schedule: { interval: weekly }
    groups:
      dev-dependencies: { dependency-type: development }
    open-pull-requests-limit: 5
