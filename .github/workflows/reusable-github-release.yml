# Creates (or updates, if it already exists) the GitHub release for a tag and attaches build artifacts.
name: reusable / github-release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      name:
        description: Release title (empty = tag).
        type: string
        default: ""
      prerelease:
        type: boolean
        default: false
      draft:
        type: boolean
        default: false
      generate-notes:
        description: Auto-generate notes from merged PRs (categories from .github/release.yml).
        type: boolean
        default: true
      artifact-pattern:
        description: download-artifact pattern selecting artifacts to attach.
        type: string
        default: "*"
      files:
        description: Globs (relative to the download dir) of files to attach.
        type: string
        default: "**/*"
    outputs:
      url:
        value: ${{ jobs.release.outputs.url }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: dist
          merge-multiple: true

      - run: ls -laR dist

      - id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.name || inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          generate_release_notes: ${{ inputs.generate-notes }}
          # legacy = GitHub picks latest by date + SemVer, so re-running an old tag does not make it "latest"
          make_latest: ${{ inputs.prerelease && 'false' || 'legacy' }}
          working_directory: dist
          files: ${{ inputs.files }}
          fail_on_unmatched_files: true
          overwrite_files: true
