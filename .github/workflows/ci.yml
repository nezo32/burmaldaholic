# PR / main checks. The only check to mark as "required" in branch protection is `ci-ok`:
# it always reports, even when path filters skip the edition jobs. See docs/ci.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main] # keeps the Gradle / npm caches warm (caches are written from the default branch)
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '25' }}
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      java: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.java == 'true' }}
      bedrock: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.bedrock == 'true' }}
      workflows: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run everything on main / manual runs
        id: force
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then echo "all=false"; else echo "all=true"; fi >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.force.outputs.all != 'true'
        with:
          filters: |
            java:
              - 'java/**'
              - '.github/workflows/ci.yml'
            bedrock:
              - 'bedrock/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'
              - 'reusable-workflows/**'

  branch-name:
    name: Branch naming
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check head branch follows the feature flow
        env:
          HEAD_REF: ${{ github.head_ref }}
          PREFIXES: ${{ vars.ALLOWED_BRANCH_PREFIXES || 'feature/ fix/ hotfix/ chore/ docs/ ci/ refactor/ test/ release/ dependabot/ claude/' }}
        run: |
          for p in $PREFIXES; do
            if [[ "$HEAD_REF" == "$p"* ]]; then
              echo "Branch '$HEAD_REF' matches '$p'."
              exit 0
            fi
          done
          echo "::error::Branch '$HEAD_REF' must start with one of: $PREFIXES (e.g. feature/slots)."
          exit 1

  java:
    name: Java (MC ${{ matrix.mc }})
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Minecraft versions the single jar supports; see java/gradle.properties (supported_mc_range).
        mc: ${{ fromJSON(vars.JAVA_MC_VERSIONS || '["26.2","26.3"]') }}
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        env:
          MC: ${{ matrix.mc }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace -Pmc="$MC"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports-${{ matrix.mc }}
          path: java/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: burmaldaholic-java-mc${{ matrix.mc }}
          path: |
            java/build/libs/*.jar
            !java/build/libs/*-sources.jar
            !java/build/libs/*-dev.jar
          retention-days: 7
          if-no-files-found: error

  bedrock:
    name: Bedrock
    needs: changes
    if: needs.changes.outputs.bedrock == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bedrock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bedrock/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint

      - name: Upload add-on
        uses: actions/upload-artifact@v7
        with:
          name: burmaldaholic-bedrock
          path: bedrock/dist/*.mcaddon
          retention-days: 7
          if-no-files-found: error

  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint (+ shellcheck)
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml reusable-workflows/*.yml

      - name: Reusable workflow copy is in sync
        run: |
          if ! diff -u .github/workflows/reusable-release.yml reusable-workflows/minecraft-release.yml; then
            echo "::error::reusable-workflows/minecraft-release.yml must be an exact copy of .github/workflows/reusable-release.yml"
            exit 1
          fi

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, branch-name, java, bedrock, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')"
          if [[ -n "$bad" ]]; then
            echo "::error::Failed jobs: $bad"
            exit 1
          fi
          echo "All required jobs passed or were skipped."
