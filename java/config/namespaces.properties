# Burmaldaholic module namespaces. Owned by core — ask core (one-line PR) to add a namespace.
#
# Every registry id, lang key, sound event, config section and asset/data file name must be OWNED by
# exactly one module. Module `m` owns a name if its first segment equals, or starts with `<ns>_`,
# `<ns>.` or `<ns>/`, for ns in {m} + the extra namespaces listed here.
#   registry id  burmaldaholic:slot_machine_copper       -> segment "slot_machine_copper"  -> slots
#   lang key     block.burmaldaholic.slot_machine_copper -> text after "burmaldaholic."     -> slots
#   config key   streak.luckyPerStep                     -> section "streak"               -> chaos
#   asset        textures/block/slot_machine_copper.png  -> file name                       -> slots
# `*` = may own anything in the burmaldaholic namespace (core only).
# Names come from docs/design (GAME_DESIGN.md / CONFIG.md); keep in sync.
core=*
blackjack=
poker=
slots=slot_machine,jackpot
roulette=
craps=
extras=lucky_coin,coin_flip,wheel_of_fortune,scratch_card,plinko,dice_duel,dice
loan=loan_shark,debt,debt_collector,asset_freeze,repo_man,accountant,enforcer,piglin_moneylender,overdue_notice,ledger_page
chaos=streak,golden_hour
lastchance=last_chance,lastChance
worldgen=casinos,village_casino,piglin_parlor,high_roller_lounge,croupier,piglin_dealer,shulker_croupier
vip=
multiplayer=ownership
baccarat=tie_streak,banco,bank_holder
pvp=
bots=
