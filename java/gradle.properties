# Gradle must run on JDK 25 (Minecraft 26.x and Loom 1.18 both require Java 25).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom + IntelliJ are not fully configuration-cache compatible yet (FabricMC/fabric-loom#1349).
org.gradle.configuration-cache=false

# ---- Mod ----
mod_id=burmaldaholic
mod_version=0.2.0
maven_group=dev.nezo.burmaldaholic
archives_base_name=burmaldaholic

# ---- Toolchain (see docs/architecture/java.md) ----
loom_version=1.18.2
loader_version=0.19.5

# ---- Target Minecraft versions ----
# Minecraft 26.3 ONLY (owner decision 2026-10-20: 26.2 support dropped). A plain `./gradlew build`
# compiles, tests and packages against `mc`. `-Pmc=<version>` still switches the target, but only
# versions with fabric_api_/modmenu_ entries below resolve. `checkLinkage` checks the jar against
# every OTHER entry of `supported_mc_versions`, so with one version it is a no-op.
# Adding a version: append it to both lines below + add fabric_api_/modmenu_ entries + CI matrix
# (.github/workflows/ci.yml) + CurseForge/Modrinth game versions (.github/workflows/release.yml, publish-modrinth.yml).
mc=26.3
supported_mc_versions=26.3
supported_mc_range=~26.3

# Per-version dependency table: <key>_<mc version with dots replaced by underscores>
fabric_api_26_3=0.161.0+26.3
modmenu_26_3=21.0.0-beta.1

# ---- Test libs ----
junit_version=5.14.4
